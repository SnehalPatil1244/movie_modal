<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css" integrity="sha384-xOolHFLEh07PJGoPkLv1IbcEPTNtaed2xpHsD9ESMhqIYd0nLMwNLD69Npy4HI+N" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="stylesheet"href="./assets/css/style.css">

    <title>Movie Model</title>
</head>
<body>
    <div class="backDrop closeModal" id="backDrop"></div>
<div class="movieModal" id="movieModal">
    <form id="MovieForm">
    <div class="card">
        <div class="card-header d-flex justify-content-between">
            <h4>Add Movie</h4>
            <i role="button" class=" closeModal fa-solid fa-xmark fa-2x"></i>

        </div>
        <div class="card-body">
                <div class="form-group">
                    <label for="MovieName">Movie Name</label>
                    <input type="text" class="form-control" id="MovieName">
                </div>

                 <div class="form-group">
                    <label for="MovieImg">Movie Image</label>
                    <input type="text" class="form-control" id="MovieImg">
                </div>
                <div class="form-group">
                    <label for="MovieDescription">Movie Description</label>
                    <textarea rows="5" id="MovieDescription" class="form-control"></textarea>
                </div>
                <div class="form-group">
                    <label for="movieRating">Movie Rating</label>
                    <select id="movieRating" class="form-control">
                        <option value="1">1</option>
                        <option value="2">2</option>
                        <option value="3">3</option>
                        <option value="4">4</option>
                        <option value="5">5</option>
                    </select>
                </div>
            </div>
        <div class="card-footer  d-flex justify-content-between">
         <button id="addmoviebtn" class="btn btn-sm net-sec-btn">Add Movie</button>
           <button type="button" id="updatemoviebtn" class="btn btn-sm net-sec-btn d-none">Update Movie</button>

         <button type="button" class="btn btn-sm net-pri-btn closeModal">Close</button>
        </div>
    </div>
    </form>
    
</div>
    <div class="container pt-5 mb-5">
        <div class="row">
            <div class="col-6">
                <a href="index.html" class="logo">
                    <img src="./assets/images/logo.svg" alt="Logo" title="Logo">
                </a>
            </div>
            <div class="col-6 align-self-center text-right">
                <button id="movieModalshowbtn" class="btn btn-sm net-pri-btn">Add Movie</button>

            </div>
        </div>
    </div>
    <div class="container-fluid">
       <div class="row" id="moviecontainer">
        <div class="col-md-3 col-sm-6 ">
            <div class="card moviecard">
                <div class="card-header">
                    <div class="row">
                        <div class="col-10">
                            <h4>Start-up</h4>
                        </div>
                        <div class="col-2">
                            <h4>
                                <span class="badge badge-success">5</span>
                            </h4>
                        </div>
                    </div>
                </div>
                <div class="card-body p-0">
                    <figure>
                        <img src="https://images.justwatch.com/poster/210477473/s718/start-up.jpg" alt="Start-up" title="Start-up">
                        <figcaption>
                            <h5>Start-up</h5>
                            <p>Lorem ipsum dolor sit amet consectetur adipisicing elit.
                                 Sequi ab laborum debitis porro, sunt, officia id a 
                                minima aut nihil, hic doloribus! 
                                Rem vitae et doloremque quia alias sint molestiae?</p>

                        </figcaption>
                    </figure>
                </div>
                <div class="card-footer d-flex justify-content-between">
                    <button class="btn btn-sm  net-sec-btn">Edit</button>
                    <button class="btn btn-sm net-pri-btn ">Remove</button>
                </div>
            </div>
        </div>
       </div>
       

    </div>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="./assets/js/app.js"></script>
</body>
</html>
